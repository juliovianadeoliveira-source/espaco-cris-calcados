<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revendedores | Espaço Cris</title>
<style>
:root{--pink:#c2185b;--dark:#24131d;--green:#15803d;--red:#b91c1c;--line:#e8dde3;--bg:#f7f3f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#261820;font-family:Inter,Segoe UI,Arial,sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginBox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 18px 60px #2b0c1a20}.brand{font-size:25px;font-weight:950;margin-bottom:8px}.brand span{color:var(--pink)}label{display:block;font-weight:800;font-size:13px;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:15px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.primary{width:100%;margin-top:18px;background:var(--dark);color:#fff}.msg{margin-top:12px;color:var(--red);font-weight:700}.header{background:linear-gradient(90deg,#65102f,var(--pink));color:#fff;padding:18px 20px;position:sticky;top:0;z-index:10}.headIn{max-width:1250px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.headIn h1{font-size:21px;margin:0}.headActions{display:flex;gap:8px;flex-wrap:wrap}.headActions button,.headActions a{border:1px solid #ffffff66;background:#ffffff14;color:#fff;padding:9px 12px;border-radius:9px;text-decoration:none;font-weight:800}.wrap{max-width:1250px;margin:22px auto;padding:0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px}.stat b{display:block;font-size:25px}.stat span{font-size:12px;color:#756b70}.toolbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:15px;display:flex;gap:9px;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px}.list{display:grid;gap:14px}.card{background:#fff;border:1px solid var(--line);border-left:6px solid #d39a18;border-radius:16px;padding:18px;box-shadow:0 6px 25px #2a10200b}.card.approved{border-left-color:var(--green)}.card.inactive{border-left-color:var(--red);opacity:.8}.head{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}.name{font-size:19px;font-weight:950}.meta{font-size:13px;color:#766d73;line-height:1.7;margin-top:4px}.badge{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:950;background:#fff3cd;color:#815d00}.badge.ok{background:#dcfce7;color:#166534}.badge.off{background:#fee2e2;color:#991b1b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.box{background:#faf7f9;border-radius:11px;padding:12px;font-size:13px;line-height:1.55}.box b{display:block;color:#2b1821;margin-bottom:2px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.ok{background:var(--green);color:#fff}.neutral{background:#e9e2e6;color:#2f2028}.danger{background:#fee2e2;color:#991b1b}.empty{text-align:center;background:#fff;border-radius:16px;padding:60px;color:#777}.notify{background:#fff6d8;border:1px solid #f2d477;padding:12px;border-radius:11px;margin-bottom:14px;font-weight:800}.orders{margin-top:15px;border:1px solid var(--line);border-radius:13px;overflow:hidden}.orders summary{cursor:pointer;list-style:none;padding:13px 15px;background:#fff7fa;color:#6d1237;font-weight:950;display:flex;align-items:center;justify-content:space-between}.orders summary::-webkit-details-marker{display:none}.orders summary:after{content:'⌄';font-size:20px;transition:.2s}.orders[open] summary:after{transform:rotate(180deg)}.ordersBody{padding:12px;display:grid;gap:12px;background:#fcfafb}.order{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px}.orderHead{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}.orderCode{font-weight:950;color:#3b1b2a}.orderStatus{font-size:11px;font-weight:900;border-radius:999px;padding:5px 9px;background:#fff3cd;color:#815d00}.client{background:#faf7f9;padding:10px;border-radius:9px;font-size:13px;line-height:1.55;margin-bottom:10px}.items{width:100%;border-collapse:collapse;font-size:13px}.items th,.items td{text-align:left;padding:8px 6px;border-bottom:1px solid #f0e8ec}.items th{color:#756b70;font-size:11px;text-transform:uppercase}.items td:last-child,.items th:last-child{text-align:right}.orderTotals{text-align:right;margin-top:10px;line-height:1.6}.orderTotals strong{color:var(--pink);font-size:16px}.noOrders{padding:14px;color:#756b70;text-align:center}@media(max-width:800px){.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.card{padding:14px}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="login" class="login"><form id="loginForm" class="loginBox"><div class="brand">Espaço <span>Cris</span> Calçados</div><h1>Revendedores</h1><p>Área administrativa de cadastro e aprovação das revendedoras.</p><label>E-mail</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><button class="btn primary" type="submit">ENTRAR</button><div id="loginMsg" class="msg"></div></form></section>
<section id="app" class="hidden"><header class="header"><div class="headIn"><div><h1>👩‍💼 Revendedores</h1><small>Cadastros, aprovação e comissão</small></div><div class="headActions"><a href="admin.html">← Voltar ao painel</a><a href="index.html" target="_blank">Ver loja</a><button id="refresh">Atualizar</button><button id="logout">Sair</button></div></div></header>
<main class="wrap"><div id="notify"></div><div class="stats"><div class="stat"><b id="sTotal">0</b><span>Total de revendedoras</span></div><div class="stat"><b id="sPending">0</b><span>Aguardando aprovação</span></div><div class="stat"><b id="sActive">0</b><span>Ativas</span></div></div><div class="toolbar"><input id="search" type="text" placeholder="Buscar por nome, e-mail ou telefone..."></div><div id="list" class="list"></div></main></section>
<script>
const URL='https://nnhljxmmrqekoxcapdkm.supabase.co',KEY='sb_publishable_mPNEE_t2HTfU5f2rUDwrig_u9ls7HrE';let token=sessionStorage.getItem('admin_token')||'',rows=[];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,opt={}){let r=await fetch(URL+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});if(r.status===401){signout();throw Error('Sessão encerrada.')}let d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.error_description||'Erro '+r.status);return d}
async function login(email,password){let r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})}),d=await r.json();if(!r.ok)throw Error(d.error_description||'E-mail ou senha incorretos.');token=d.access_token;let ok=await request('/rest/v1/rpc/is_espaco_cris_admin',{method:'POST',body:'{}'});if(ok!==true){token='';throw Error('Este usuário não possui acesso administrativo.')}sessionStorage.setItem('admin_token',token)}
function signout(){sessionStorage.removeItem('admin_token');token='';$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}
$('#loginForm').onsubmit=async e=>{e.preventDefault();let m=$('#loginMsg'),b=e.submitter;m.textContent='';b.disabled=true;b.textContent='ENTRANDO...';try{await login($('#email').value,$('#password').value);showApp()}catch(err){m.textContent=err.message}finally{b.disabled=false;b.textContent='ENTRAR'}};
async function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load()}
function address(r){return [r.rua&&r.rua+', '+(r.numero||''),r.complemento,r.bairro,r.cidade&&r.cidade+'/'+(r.estado||''),r.cep&&'CEP '+r.cep].filter(Boolean).map(esc).join('<br>')||'—'}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function orderCard(p){let c=p.clientes||{},e=p.endereco||{},itens=p.pedido_itens||[],commission=itens.reduce((s,i)=>s+Number(i.valor_comissao||0),0);return `<section class="order"><div class="orderHead"><div><div class="orderCode">Pedido #${esc(String(p.id||'').slice(0,8).toUpperCase())}</div><div class="meta">${p.created_at?new Date(p.created_at).toLocaleString('pt-BR'):'—'}</div></div><span class="orderStatus">${esc(String(p.status||'pendente').toUpperCase())}</span></div><div class="client"><b>Cliente:</b> ${esc(c.nome||e.nome||'—')} · <b>Telefone:</b> ${esc(c.telefone||e.telefone||'—')}${c.email?'<br><b>E-mail:</b> '+esc(c.email):''}${c.cpf||e.cpf?'<br><b>CPF:</b> '+esc(c.cpf||e.cpf):''}<br><b>Entrega:</b> ${address(e)}</div><table class="items"><thead><tr><th>Produto</th><th>Tam.</th><th>Qtd.</th><th>Valor</th></tr></thead><tbody>${itens.map(i=>`<tr><td>${esc(i.nome_produto||'Produto')}</td><td>${esc(i.tamanho||'—')}</td><td>${Number(i.quantidade||0)}</td><td>${money(i.subtotal)}</td></tr>`).join('')||'<tr><td colspan="4">Itens não encontrados</td></tr>'}</tbody></table><div class="orderTotals">Total do pedido: <strong>${money(p.total)}</strong><br>Comissão: <b>${money(commission)}</b></div></section>`}
function ordersBlock(r){let pedidos=r.pedidos||[];return `<details class="orders"><summary>Ver o que foi pedido (${pedidos.length})</summary><div class="ordersBody">${pedidos.length?pedidos.map(orderCard).join(''):'<div class="noOrders">Nenhum pedido vinculado.</div>'}</div></details>`}
function card(r){let approved=!!r.aprovado,active=!!r.ativo;return `<article class="card ${approved?'approved':''} ${!active?'inactive':''}"><div class="head"><div><div class="name">${esc(r.nome||'Sem nome')}</div><div class="meta">${esc(r.email||'—')}<br>${esc(r.telefone||'—')}</div></div><span class="badge ${!active?'off':approved?'ok':''}">${!active?'INATIVA':approved?'APROVADA':'AGUARDANDO APROVAÇÃO'}</span></div><div class="grid"><div class="box"><b>Comissão</b>${Number(r.comissao_percentual||30).toLocaleString('pt-BR')}%</div><div class="box"><b>Cadastro</b>${r.created_at?new Date(r.created_at).toLocaleString('pt-BR'):'—'}</div><div class="box"><b>Endereço</b>${address(r)}</div><div class="box"><b>Vendas vinculadas</b>${r.vendas||0} pedido(s)<br><strong>${Number(r.comissao||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</strong> em comissão</div></div>${ordersBlock(r)}<div class="actions">${!approved&&active?`<button class="btn ok" onclick="approve('${r.id}',true)">✓ Aprovar revendedora</button>`:''}${approved&&active?`<button class="btn danger" onclick="approve('${r.id}',false)">Bloquear aprovação</button>`:''}${active?`<button class="btn neutral" onclick="setActive('${r.id}',false)">Desativar</button>`:`<button class="btn ok" onclick="setActive('${r.id}',true)">Ativar</button>`}<button class="btn neutral" onclick="editCommission('${r.id}',${Number(r.comissao_percentual||30)})">Editar comissão</button><button class="btn danger" onclick="deleteReseller('${r.id}',this)">🗑 Excluir revendedora</button></div></article>`}
function render(){let q=$('#search').value.toLowerCase().trim(),list=rows.filter(r=>[r.nome,r.email,r.telefone].join(' ').toLowerCase().includes(q));$('#list').innerHTML=list.length?list.map(card).join(''):'<div class="empty"><h2>Nenhum revendedor encontrado</h2><p>Os novos cadastros aparecerão aqui.</p></div>';$('#sTotal').textContent=rows.length;$('#sPending').textContent=rows.filter(r=>!r.aprovado&&r.ativo).length;$('#sActive').textContent=rows.filter(r=>r.ativo).length}
async function load(){try{let [revRows,pedidos]=await Promise.all([request('/rest/v1/revendedoras?select=*&order=created_at.desc'),request('/rest/v1/pedidos?select=id,created_at,revendedora_id,status,total,endereco,observacoes,clientes(nome,email,telefone,cpf),pedido_itens(nome_produto,tamanho,quantidade,preco_unitario,subtotal,valor_comissao)&revendedora_id=not.is.null&order=created_at.desc')]);rows=revRows.map(r=>{let todos=pedidos.filter(p=>p.revendedora_id===r.id),vendas=todos.filter(p=>p.status!=='cancelado'),comissao=vendas.reduce((s,p)=>s+(p.pedido_itens||[]).reduce((x,i)=>x+Number(i.valor_comissao||0),0),0);return{...r,pedidos:todos,vendas:vendas.length,comissao}});render()}catch(err){$('#list').innerHTML='<div class="empty">'+esc(err.message)+'</div>'}}
async function approve(id,value){let action=value?'aprovar':'bloquear a aprovação desta';if(!confirm('Deseja '+action+' revendedora?'))return;try{await patch(id,{aprovado:value,updated_at:new Date().toISOString()});$('#notify').innerHTML='<div class="notify">Revendedora atualizada com sucesso.</div>';await load()}catch(err){alert(err.message)}}
async function editCommission(id,current){let value=prompt('Digite a comissão da revendedora em porcentagem:',String(current).replace('.',','));if(value===null)return;let numero=Number(value.replace(',','.'));if(!Number.isFinite(numero)||numero<0||numero>100){alert('Informe uma comissão entre 0% e 100%.');return}try{await patch(id,{comissao_percentual:numero,updated_at:new Date().toISOString()});$('#notify').innerHTML='<div class="notify">Comissão atualizada para '+numero.toLocaleString('pt-BR')+'%.</div>';await load()}catch(err){alert(err.message)}}
async function setActive(id,value){let action=value?'ativar':'desativar';if(!confirm('Deseja '+action+' esta revendedora?'))return;try{await patch(id,{ativo:value,updated_at:new Date().toISOString()});$('#notify').innerHTML='<div class="notify">Status atualizado com sucesso.</div>';await load()}catch(err){alert(err.message)}}
async function deleteReseller(id,button){
 const registro=rows.find(r=>r.id===id),nome=registro?.nome||'esta revendedora';
 if(!confirm('Excluir definitivamente '+nome+'? Esta ação não pode ser desfeita.'))return;
 const original=rows;rows=rows.filter(r=>r.id!==id);render();
 if(button){button.disabled=true;button.textContent='EXCLUINDO...'}
 try{
  let ok=await request('/rest/v1/rpc/excluir_revendedora_admin',{method:'POST',body:JSON.stringify({p_id:id})});
  if(ok!==true)throw Error('Revendedora não encontrada ou já excluída.');
  $('#notify').innerHTML='<div class="notify">Revendedora excluída com sucesso.</div>';
 }catch(err){
  rows=original;render();
  $('#notify').innerHTML='<div class="notify">Não foi possível excluir: '+esc(err.message)+'</div>';
  alert('Não foi possível excluir: '+err.message);
 }
}
async function patch(id,body){return request('/rest/v1/revendedoras?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)})}
$('#search').oninput=render;$('#refresh').onclick=load;$('#logout').onclick=signout;if(token)showApp();
</script>
</body></html>
