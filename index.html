<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espaço Cris Calçados Multimarca</title><style>:root{--p:#c2185b;--d:#19151a;--bg:#faf8fa;--line:#eee5eb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--d)}header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}.top{background:linear-gradient(90deg,#8e1747,#c2185b,#ef477c);color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:800}.bar{max-width:1250px;margin:auto;padding:18px 20px;display:flex;gap:18px;align-items:center}.brand{font-size:22px;font-weight:900;white-space:nowrap}.brand span{color:var(--p)}.search{flex:1}.search input{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:14px;font-size:15px;outline:none}.cart,.buy{border:0;background:var(--d);color:#fff;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.hero{max-width:1250px;margin:28px auto 18px;padding:0 20px}.heroBox{border-radius:25px;padding:34px;background:linear-gradient(120deg,#24131d,#6d163d 60%,#c2185b);color:#fff}.hero h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}.hero p{margin:0;opacity:.9}.tools{max-width:1250px;margin:auto;padding:0 20px 16px;display:flex;gap:10px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.pill.active{background:var(--p);border-color:var(--p);color:#fff}.status{margin-left:auto;color:#746d75;font-size:13px;padding:10px}.grid{max-width:1250px;margin:auto;padding:0 20px 50px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 7px 25px #22111d0a}.photo{aspect-ratio:1;display:block;background:#f5f1f4;object-fit:cover;width:100%}.info{padding:14px}.name{font-weight:800;line-height:1.3;min-height:42px}.cat{font-size:12px;color:#746d75;margin:6px 0}.price{font-size:19px;font-weight:900}.old{text-decoration:line-through;color:#999;font-size:13px;margin-right:5px}.promo{color:var(--p);font-size:20px;font-weight:900}.buy{width:100%;margin-top:12px}.empty,.loading{grid-column:1/-1;text-align:center;padding:60px;color:#746d75}.error{max-width:900px;margin:20px auto;padding:14px 20px;background:#fff0f3;border:1px solid #ffd0db;color:#a31644;border-radius:14px;display:none}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.box{background:#fff;max-width:920px;width:100%;border-radius:22px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}.box img{width:100%;height:100%;object-fit:cover;min-height:420px;background:#f5f1f4}.detail{padding:28px}.close{float:right;border:0;background:#f3edf1;border-radius:50%;width:36px;height:36px;cursor:pointer}.qty{display:flex;gap:8px;align-items:center;margin:18px 0}.qty button{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:20px}.qty b{min-width:30px;text-align:center}.whats{display:block;text-align:center;text-decoration:none;background:#25d366;color:#fff;padding:13px;border-radius:12px;font-weight:900}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.bar{flex-wrap:wrap}.brand{width:100%}.grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:0 10px 40px}.hero,.tools{padding-left:10px;padding-right:10px}.box{grid-template-columns:1fr}.box img{min-height:280px}}</style></head><body><header><div class="top">Catálogo atualizado automaticamente • Espaço Cris Calçados Multimarca</div><div class="bar"><div class="brand">Espaço <span>Cris</span> Calçados</div><div class="search"><input id="search" placeholder="Pesquisar produto ou código..."></div><button class="cart">🛒 <span id="cartCount">0</span></button></div></header><section class="hero"><div class="heroBox"><h1>Seu catálogo, sempre atualizado.</h1><p>Produtos e preços sincronizados automaticamente com o catálogo central.</p></div></section><div id="error" class="error"></div><div class="tools"><button class="pill active" data-cat="all">Todos</button><span id="cats"></span><span class="status" id="status">Conectando ao catálogo...</span></div><main id="grid" class="grid"><div class="loading">Carregando produtos...</div></main><div class="modal" id="modal"><div class="box"><img id="modalImg" alt=""><div class="detail"><button class="close" id="close">×</button><div class="cat" id="modalCat"></div><h2 id="modalName"></h2><div id="modalPrice"></div><div class="qty"><button id="minus">−</button><b id="qty">1</b><button id="plus">+</button></div><a class="whats" id="whats" target="_blank" rel="noopener">Enviar pedido pelo WhatsApp</a></div></div></div><script>const CONFIG={supabaseUrl:'https://nnhljxmmrqekoxcapdkm.supabase.co',supabaseKey:'sb_publishable_mPNEE_t2HTfU5f2rUDwrig_u9ls7HrE',catalogUrl:'data/catalog.json',whatsapp:'',refreshMs:300000};let products=[],filtered=[],active='all',selected=null,qty=1;const $=s=>document.querySelector(s),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function image(p){return p.image_url||p.image||p.imagem||p.foto||p.images?.[0]?.url||p.imagens?.[0]?.url||''}function priceHtml(p){const price=Number(p.price||p.preco||0),promo=Number(p.promotional_price||p.preco_promocional||p.promo_price||0);return promo>0&&promo<price?`<span class="old">${money(price)}</span><span class="promo">${money(promo)}</span>`:`<span class="price">${money(price)}</span>`}function render(){filtered=products.filter(p=>(active==='all'||String(p.category||p.categoria||'').toLowerCase()===active)&&(`${p.name||p.nome||''} ${p.code||p.codigo||''}`).toLowerCase().includes($('#search').value.toLowerCase()));$('#status').textContent=`${filtered.length} produto${filtered.length===1?'':'s'}`;$('#grid').innerHTML=filtered.length?filtered.map((p,i)=>`<article class="card"><img class="photo" loading="lazy" src="${image(p)}" alt="Produto" onerror="this.style.visibility='hidden'"><div class="info"><div class="name">${p.name||p.nome||'Produto'}</div><div class="cat">${p.category||p.categoria||''}</div><div>${priceHtml(p)}</div><button class="buy" onclick="openProduct(${i})">Ver produto</button></div></article>`).join(''):`<div class="empty">Nenhum produto encontrado.</div>`}function categories(){const c=[...new Set(products.map(p=>p.category||p.categoria).filter(Boolean))];$('#cats').innerHTML=c.map(x=>`<button class="pill" data-cat="${x}">${x}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{active=b.dataset.cat.toLowerCase()==='all'?'all':b.dataset.cat;document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('active',x.dataset.cat===b.dataset.cat));render()})}window.openProduct=i=>{selected=filtered[i];qty=1;$('#qty').textContent=qty;$('#modalName').textContent=selected.name||selected.nome;$('#modalCat').textContent=selected.category||selected.categoria||'';$('#modalImg').src=image(selected);$('#modalPrice').innerHTML=priceHtml(selected);updateWhats();$('#modal').classList.add('open')};function updateWhats(){if(!selected)return;const unit=Number(selected.promotional_price||selected.preco_promocional||selected.promo_price||selected.price||selected.preco||0),text=`Olá! Quero fazer um pedido pelo Espaço Cris.%0A%0AProduto: ${selected.name||selected.nome}%0AQuantidade: ${qty}%0AValor unitário: ${money(unit)}%0ATotal: ${money(unit*qty)}`;$('#whats').href=CONFIG.whatsapp?`https://wa.me/${CONFIG.whatsapp.replace(/\D/g,'')}?text=${text}`:'#'}$('#plus').onclick=()=>{qty++;$('#qty').textContent=qty;updateWhats()};$('#minus').onclick=()=>{qty=Math.max(1,qty-1);$('#qty').textContent=qty;updateWhats()};$('#close').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};$('#search').oninput=render;async function sb(path){const r=await fetch(CONFIG.supabaseUrl+'/rest/v1/'+path,{headers:{apikey:CONFIG.supabaseKey,Authorization:'Bearer '+CONFIG.supabaseKey}});if(!r.ok)throw Error('Supabase respondeu HTTP '+r.status);return r.json()}async function load(){try{const rows=await sb('produtos?select=id,nome,descricao,preco,preco_promocional,ativo,destaque&ativo=eq.true&order=nome.asc');const ids=rows.map(x=>x.id);let imgs=[];if(ids.length){const parts=[];for(let i=0;i<ids.length;i+=40){const batch=ids.slice(i,i+40);parts.push(Promise.all(batch.map(id=>sb('produto_imagens?select=produto_id,url,ordem&produto_id=eq.'+encodeURIComponent(id)+'&order=ordem.asc'))))}const nested=await Promise.all(parts);imgs=nested.flat(2)}const by={};imgs.forEach(x=>{(by[x.produto_id]??=[]).push(x.url)});products=rows.map(p=>({id:p.id,name:p.nome,description:p.descricao,price:p.preco,promotional_price:p.preco_promocional,active:p.ativo,featured:p.destaque,images:(by[p.id]||[]).map(url=>({url})),image_url:(by[p.id]||[])[0]||''}));categories();render()}catch(e){console.error(e);try{const r=await fetch(CONFIG.catalogUrl+'?t='+Date.now());if(!r.ok)throw Error('Catálogo indisponível');const d=await r.json();products=Array.isArray(d)?d:(d.products||d.produtos||[]);categories();render();$('#status').textContent='Catálogo local'}catch(e2){$('#error').style.display='block';$('#error').textContent='Não foi possível carregar o catálogo. Verifique as permissões de leitura do Supabase.';$('#grid').innerHTML='<div class="empty">Catálogo temporariamente indisponível.</div>'}}}load();setInterval(load,CONFIG.refreshMs);</script></body></html>
