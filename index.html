    });
    let tag = '';
    if (p.promocao) tag = '<div class="tag-promo">Promoção</div>';
    else if (p.categoria === 'lancamento') tag = '<div class="tag-lancamento">Novo</div>';
    let precoHtml = 'R$ ' + p.preco.toFixed(2).replace('.',',');
    if (p.precoAntigo) {
      precoHtml = '<span class="old-price">R$ ' + p.precoAntigo.toFixed(2).replace('.',',') + '</span> R$ ' + p.preco.toFixed(2).replace('.',',');
    }
    const el = document.createElement('div');
    el.className = 'product-card';
    el.innerHTML = '<div class="product-image-container" id="img-container-' + p.id + '">' + tag +
      '<button class="card-arrow prev" onclick="mudarFoto(' + p.id + ',-1)"><i class="fa-solid fa-chevron-left"></i></button>' +
      imgs +
      '<button class="card-arrow next" onclick="mudarFoto(' + p.id + ',1)"><i class="fa-solid fa-chevron-right"></i></button>' +
      '<div class="card-dots" id="dots-' + p.id + '">' + dots + '</div></div>' +
      '<div class="product-info"><h4 class="product-title">' + p.nome + '</h4>' +
      '<div class="product-price">' + precoHtml + '</div>' +
      '<div class="product-installment">Em até 6x R$ ' + parcela + ' sem juros</div>' +
      '<div class="quantity-control"><button onclick="mudarQtd(' + p.id + ',-1)">-</button><span id="qtd-' + p.id + '">1</span><button onclick="mudarQtd(' + p.id + ',1)">+</button></div>' +
      '<button class="add-to-cart-btn" onclick="adicionarAoCarrinho(' + p.id + ')">ADICIONAR À SACOLA</button></div>';
    grid.appendChild(el);
    document.getElementById('img-container-' + p.id).dataset.currentIndex = 0;
  });
}

function mudarFoto(id, d) {
  const c = document.getElementById('img-container-' + id);
  const prod = produtos.find(x => x.id === id);
  let idx = parseInt(c.dataset.currentIndex) + d;
  if (idx < 0) idx = prod.imagens.length - 1;
  if (idx >= prod.imagens.length) idx = 0;
  c.dataset.currentIndex = idx;
  c.querySelectorAll('img').forEach((img, i) => img.classList.toggle('active', i === idx));
  c.querySelectorAll('.card-dot').forEach((dot, i) => dot.classList.toggle('active', i === idx));
}

function filtrarPorCategoria(cat, ev) {
  if (ev) ev.preventDefault();
  categoriaAtual = cat;
  document.querySelectorAll('.nav-menu a').forEach(a => a.classList.remove('active'));
  if (ev && ev.target) ev.target.classList.add('active');
  const tit = document.getElementById('sectionTitle');
  let filtrados = [];
  if (cat === 'lancamento') { filtrados = produtos.filter(p => p.categoria === 'lancamento'); tit.innerText = 'Lançamentos em Destaque'; }
  else if (cat === 'sandalia') { filtrados = produtos.filter(p => p.categoria === 'sandalia'); tit.innerText = 'Sandálias em Destaque'; }
  else if (cat === 'promocao') { filtrados = produtos.filter(p => p.promocao); tit.innerText = 'Calçados em Promoção'; }
  else { filtrados = produtos; tit.innerText = 'Todos os Produtos'; }
  renderizarProdutos(filtrados);
}

function filtrarProdutos() {
  const t = document.getElementById('searchInput').value.toLowerCase();
  let base = produtos.filter(p => {
    if (categoriaAtual === 'lancamento') return p.categoria === 'lancamento';
    if (categoriaAtual === 'sandalia') return p.categoria === 'sandalia';
    if (categoriaAtual === 'promocao') return p.promocao;
    return true;
  });
  renderizarProdutos(base.filter(p => p.nome.toLowerCase().includes(t)));
}

function mudarQtd(id, d) {
  const el = document.getElementById('qtd-' + id);
  let v = parseInt(el.innerText) + d;
  if (v < 1) v = 1;
  if (v > 10) v = 10;
  el.innerText = v;
}

function adicionarAoCarrinho(id) {
  const p = produtos.find(x => x.id === id);
  const qtd = parseInt(document.getElementById('qtd-' + id).innerText);
  const item = carrinho.find(x => x.id === id);
  if (item) item.qtd += qtd;
  else carrinho.push({ id: p.id, nome: p.nome, preco: p.preco, imagem: p.imagens[0], qtd: qtd });
  atualizarCarrinho();
  toggleCart(true);
}

function atualizarCarrinho() {
  const container = document.getElementById('cartItems');
  const count = document.getElementById('cartCount');
  const total = document.getElementById('cartTotal');
  container.innerHTML = '';
  let sum = 0;
  let qtdTotal = 0;
  if (carrinho.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">Sua sacola está vazia</p>';
  } else {
    carrinho.forEach(item => {
      sum += item.preco * item.qtd;
      qtdTotal += item.qtd;
      container.innerHTML += '<div class="cart-item"><img src="' + item.imagem + '" alt=""><div class="cart-item-info"><h4>' + item.nome + '</h4><div class="cart-price">R$ ' + item.preco.toFixed(2).replace('.',',') + ' x ' + item.qtd + '</div></div></div>';
    });
  }
  count.innerText = qtdTotal;
  let totalStr = 'R$ ' + sum.toFixed(2).replace('.',',');
  if (cupomAplicado) {
    const desc = sum * 0.05;
    totalStr = '<span style="text-decoration:line-through;color:#999;font-size:14px;">R$ ' + sum.toFixed(2).replace('.',',') + '</span> R$ ' + (sum - desc).toFixed(2).replace('.',',');
  }
  total.innerHTML = totalStr;
}

function toggleCart(forceOpen) {
  const sidebar = document.getElementById('cartSidebar');
  const overlay = document.getElementById('cartOverlay');
  if (forceOpen || !sidebar.classList.contains('open')) {
    sidebar.classList.add('open');
    overlay.classList.add('active');
  } else {
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
  }
}

function finalizarPedido() {
  if (carrinho.length === 0) { alert('Sua sacola está vazia!'); return; }
  let texto = 'Olá! Gostaria de finalizar minha compra na Espaço Cris Calçados:%0A%0A';
  let total = 0;
  carrinho.forEach(item => {
    total += item.preco * item.qtd;
    texto += '• ' + item.nome + ' - Qtd: ' + item.qtd + ' - R$ ' + (item.preco * item.qtd).toFixed(2).replace('.',',') + '%0A';
  });
  if (cupomAplicado) {
    const desc = total * 0.05;
    total -= desc;
    texto += '%0A*Cupom 5% OFF aplicado!*%0A';
  }
  texto += '%0ATotal: R$ ' + total.toFixed(2).replace('.',',');
  window.open('https://wa.me/5527997787772?text=' + texto, '_blank');
}

function fecharPopup() { document.getElementById('popup5off').classList.remove('active'); }
function aplicarCupom() {
  const email = document.getElementById('emailCupom').value;
  if (email.includes('@')) { cupomAplicado = true; fecharPopup(); alert('Cupom de 5% OFF aplicado!'); atualizarCarrinho(); }
  else { alert('Por favor, digite um e-mail válido.'); }
}

window.onload = function() {
  filtrarPorCategoria('lancamento');
  setTimeout(() => document.getElementById('popup5off').classList.add('active'), 2000);
};
</script>
</body>
</html>
