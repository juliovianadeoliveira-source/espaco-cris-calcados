<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Administrativo | Espaço Cris</title>
<style>
:root{--pink:#c2185b;--dark:#24131d;--green:#15803d;--yellow:#a16207;--red:#b91c1c;--line:#e8dde3;--bg:#f7f3f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#261820;font-family:Inter,Segoe UI,Arial,sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginBox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 18px 60px #2b0c1a20}.brand{font-size:25px;font-weight:950;margin-bottom:8px}.brand span{color:var(--pink)}label{display:block;font-weight:800;font-size:13px;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:15px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:900;cursor:pointer}.primary{width:100%;margin-top:18px;background:var(--dark);color:#fff}.msg{margin-top:12px;color:var(--red);font-weight:700}.header{background:linear-gradient(90deg,#65102f,var(--pink));color:#fff;padding:18px 20px;position:sticky;top:0;z-index:10}.headIn{max-width:1250px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.headIn h1{font-size:21px;margin:0}.headActions{display:flex;gap:8px}.headActions button,.headActions a{border:1px solid #ffffff66;background:#ffffff14;color:#fff;padding:9px 12px;border-radius:9px;text-decoration:none;font-weight:800}.wrap{max-width:1250px;margin:22px auto;padding:0 14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px}.stat b{display:block;font-size:25px}.stat span{font-size:12px;color:#756b70}.toolbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:15px;display:flex;gap:9px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--line);border-radius:9px}.toolbar input{flex:1;min-width:220px}.orders{display:grid;gap:14px}.card{background:#fff;border:1px solid var(--line);border-left:6px solid #d39a18;border-radius:16px;padding:19px;box-shadow:0 6px 25px #2a10200b}.card.pago{border-left-color:var(--green)}.card.cancelado{border-left-color:var(--red);opacity:.78}.cardHead{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}.code{font-size:18px;font-weight:950}.date{font-size:12px;color:#766d73}.badge{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:950;background:#fff3cd;color:#815d00}.badge.pago{background:#dcfce7;color:#166534}.badge.cancelado{background:#fee2e2;color:#991b1b}.details{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:15px 0}.panel{background:#faf7f9;border-radius:11px;padding:13px;font-size:13px;line-height:1.65}.panel b{color:#2b1821}.items{grid-column:1/-1}.item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #ddd;padding:6px 0}.totals{margin-left:auto;width:min(330px,100%)}.row{display:flex;justify-content:space-between;padding:4px 0}.row.total{font-size:18px;font-weight:950;color:var(--pink);border-top:1px solid var(--line);padding-top:8px;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.ok{background:var(--green);color:#fff}.chat{background:#25d366;color:#fff;text-decoration:none}.neutral{background:#e9e2e6;color:#2f2028}.danger{background:#fee2e2;color:#991b1b}.empty{text-align:center;background:#fff;border-radius:16px;padding:60px;color:#777}.notify{background:#fff6d8;border:1px solid #f2d477;padding:12px;border-radius:11px;margin-bottom:14px;font-weight:800}.free{color:var(--green);font-weight:900}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.details{grid-template-columns:1fr}.items{grid-column:auto}.card{padding:14px}} 
</style></head><body>
<section id="login" class="login"><form id="loginForm" class="loginBox"><div class="brand">Espaço <span>Cris</span> Calçados</div><h1>Painel administrativo</h1><p>Entre para visualizar pedidos, clientes e pagamentos PIX.</p><label>E-mail</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><button class="btn primary" type="submit">ENTRAR NO PAINEL</button><div id="loginMsg" class="msg"></div></form></section>
<section id="app" class="hidden"><header class="header"><div class="headIn"><div><h1>🛍️ Painel Espaço Cris</h1><small>Pedidos e pagamentos em tempo real</small></div><div class="headActions"><a href="index.html" target="_blank">Ver loja</a><button id="refresh">Atualizar</button><button id="logout">Sair</button></div></div></header><main class="wrap"><div id="notify"></div><div class="stats"><div class="stat"><b id="sTotal">0</b><span>Total de pedidos</span></div><div class="stat"><b id="sPending">0</b><span>Aguardando PIX</span></div><div class="stat"><b id="sPaid">0</b><span>Pagamentos confirmados</span></div><div class="stat"><b id="sRevenue">R$ 0</b><span>Total confirmado</span></div></div><div class="toolbar"><input id="search" placeholder="Buscar cliente, pedido ou telefone..."><select id="filter"><option value="todos">Todos</option><option value="pendente">Aguardando PIX</option><option value="pago">Pagos</option><option value="cancelado">Cancelados</option></select></div><div id="orders" class="orders"></div></main></section>
<script>
const URL='https://nnhljxmmrqekoxcapdkm.supabase.co',KEY='sb_publishable_mPNEE_t2HTfU5f2rUDwrig_u9ls7HrE';let token=sessionStorage.getItem('admin_token')||'',orders=[],firstLoad=true,lastTop='';
const $=s=>document.querySelector(s),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,opt={}){let r=await fetch(URL+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});if(r.status===401){signout();throw Error('Sessão encerrada.')}let d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.error_description||'Erro '+r.status);return d}
async function login(email,password){let r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})}),d=await r.json();if(!r.ok)throw Error(d.error_description||'E-mail ou senha incorretos.');token=d.access_token;let ok=await request('/rest/v1/rpc/is_espaco_cris_admin',{method:'POST',body:'{}'});if(ok!==true){token='';throw Error('Este usuário não possui acesso administrativo.')}sessionStorage.setItem('admin_token',token)}
function signout(){sessionStorage.removeItem('admin_token');token='';$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}
$('#loginForm').onsubmit=async e=>{e.preventDefault();let m=$('#loginMsg'),b=e.submitter;m.textContent='';b.disabled=true;b.textContent='ENTRANDO...';try{await login($('#email').value,$('#password').value);showApp()}catch(err){m.textContent=err.message}finally{b.disabled=false;b.textContent='ENTRAR NO PAINEL'}};
async function showApp(){ $('#login').classList.add('hidden');$('#app').classList.remove('hidden');if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();await load()}
function address(e={}){return [e.rua&&e.rua+', '+(e.numero||''),e.complemento,e.bairro,e.cidade&&e.cidade+'/'+(e.estado||''),e.cep&&'CEP '+e.cep].filter(Boolean).map(esc).join('<br>')}
function statusClass(p){return p.status==='cancelado'?'cancelado':p.pagamento_status==='aprovado'?'pago':'pendente'}
function phoneLink(v){let n=String(v||'').replace(/\D/g,'');if(n&&!n.startsWith('55'))n='55'+n;return 'https://wa.me/'+n}
function card(p){let cl=p.clientes||{},items=p.pedido_itens||[],pay=p.pagamentos?.[0]||{},sc=statusClass(p),label=sc==='pago'?'PIX CONFIRMADO':sc==='cancelado'?'CANCELADO':'AGUARDANDO PIX';return `<article class="card ${sc}"><div class="cardHead"><div><div class="code">#${esc(p.codigo||p.id.slice(0,8))}</div><div class="date">${new Date(p.created_at).toLocaleString('pt-BR')}</div></div><span class="badge ${sc}">${label}</span></div><div class="details"><div class="panel"><b>Cliente</b><br>${esc(cl.nome)}<br>CPF: ${esc(cl.cpf||'—')}<br>Telefone: ${esc(cl.telefone)}<br>E-mail: ${esc(cl.email||'—')}</div><div class="panel"><b>Endereço de entrega</b><br>${address(p.endereco)}</div><div class="panel items"><b>Itens</b>${items.map(i=>`<div class="item"><span>${esc(i.nome_produto)} • Tam. ${esc(i.tamanho)} • ${i.quantidade} un.</span><b>${money(i.subtotal)}</b></div>`).join('')}</div></div><div class="totals"><div class="row"><span>Subtotal</span><b>${money(p.subtotal)}</b></div><div class="row"><span>Frete</span><b class="${Number(p.frete)===0?'free':''}">${Number(p.frete)===0?'GRÁTIS':money(p.frete)}</b></div><div class="row total"><span>Total</span><span>${money(p.total)}</span></div></div><div class="actions">${sc==='pendente'?'<button class="btn ok" onclick="confirmPix(\''+p.id+'\')">✓ Confirmar PIX</button>':''}<a class="btn chat" href="${phoneLink(cl.telefone)}" target="_blank">💬 Conversar com cliente</a>${sc!=='cancelado'?'<button class="btn danger" onclick="cancelOrder(\''+p.id+'\')">Cancelar pedido</button>':''}<button class="btn danger" onclick="deleteOrder(\''+p.id+'\',\''+esc(p.codigo||p.id.slice(0,8))+'\')">🗑 Excluir pedido</button></div></article>`}
function render(){let q=$('#search').value.toLowerCase(),f=$('#filter').value,list=orders.filter(p=>{let cl=p.clientes||{},sc=statusClass(p);return(f==='todos'||sc===f)&&[p.codigo,cl.nome,cl.telefone,cl.email].join(' ').toLowerCase().includes(q)});$('#orders').innerHTML=list.length?list.map(card).join(''):'<div class="empty"><h2>Nenhum pedido encontrado</h2><p>As novas compras aparecerão aqui automaticamente.</p></div>';$('#sTotal').textContent=orders.length;$('#sPending').textContent=orders.filter(p=>statusClass(p)==='pendente').length;$('#sPaid').textContent=orders.filter(p=>statusClass(p)==='pago').length;$('#sRevenue').textContent=money(orders.filter(p=>statusClass(p)==='pago').reduce((s,p)=>s+Number(p.total||0),0))}
function beep(){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(a.currentTime+.25)}catch{}}
async function load(){try{let d=await request('/rest/v1/pedidos?select=*,clientes(*),pedido_itens(*),pagamentos(*)&order=created_at.desc');if(!firstLoad&&d[0]&&d[0].id!==lastTop){beep();$('#notify').innerHTML='<div class="notify">🔔 Nova compra recebida! Confira o pedido abaixo.</div>';if(Notification.permission==='granted')new Notification('Nova compra na Espaço Cris',{body:'Abra o painel para ver os dados e o pagamento.'})}orders=d;lastTop=d[0]?.id||'';firstLoad=false;render()}catch(err){$('#orders').innerHTML='<div class="empty">'+esc(err.message)+'</div>'}}
async function patch(table,id,body){return request('/rest/v1/'+table+'?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)})}
async function confirmPix(id){if(!confirm('Confirma que o PIX deste pedido foi recebido?'))return;await patch('pedidos',id,{pagamento_status:'aprovado',status:'pago',pago_em:new Date().toISOString(),updated_at:new Date().toISOString()});let p=orders.find(x=>x.id===id),pay=p?.pagamentos?.[0];if(pay)await patch('pagamentos',pay.id,{status:'aprovado',updated_at:new Date().toISOString()});await load()}
async function cancelOrder(id){if(!confirm('Cancelar este pedido?'))return;await patch('pedidos',id,{status:'cancelado',pagamento_status:'cancelado',updated_at:new Date().toISOString()});await load()}
async function deleteOrder(id,codigo){if(!confirm('Excluir permanentemente o pedido #'+codigo+'? Esta ação não pode ser desfeita.'))return;try{let r=await fetch(URL+'/functions/v1/excluir-pedido',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({pedido_id:id})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Falha ao excluir.');orders=orders.filter(p=>p.id!==id);render();$('#notify').innerHTML='<div class="notify">Pedido #'+esc(codigo)+' excluído permanentemente.</div>'}catch(err){alert(err.message)}}
$('#search').oninput=render;$('#filter').onchange=render;$('#refresh').onclick=load;$('#logout').onclick=signout;if(token)showApp();setInterval(()=>{if(token)load()},20000);
</script></body></html>
