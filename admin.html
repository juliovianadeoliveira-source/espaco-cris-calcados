
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin - Espaço Cris</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; color: #2d2d2d; line-height: 1.5; padding: 20px; }
.container { max-width: 900px; margin: auto; }
.header { background: #b83280; color: #fff; padding: 24px; border-radius: 14px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.header h1 { font-size: 22px; }
.header p { font-size: 13px; opacity: .9; }
.header a { color: #fff; text-decoration: underline; font-size: 13px; }
.pedido-card { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.06); border-left: 5px solid #ecc94b; }
.pedido-card.confirmado { border-left-color: #38a169; }
.pedido-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.pedido-id { font-size: 13px; color: #888; font-family: monospace; }
.pedido-status { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: .5px; }
.status-pendente { background: #fef3c7; color: #92400e; }
.status-confirmado { background: #d1fae5; color: #065f46; }
.pedido-dados { font-size: 14px; color: #555; margin-bottom: 12px; }
.pedido-dados strong { color: #2d2d2d; }
.pedido-itens { background: #f9f9f9; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.pedido-itens h4 { font-size: 13px; margin-bottom: 8px; color: #444; }
.item-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed #e5e5e5; }
.item-row:last-child { border-bottom: none; }
.pedido-total { font-size: 18px; font-weight: 800; color: #b83280; text-align: right; margin-bottom: 12px; }
.acoes { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: none; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; transition: .2s; display: inline-flex; align-items: center; gap: 6px; }
.btn-confirmar { background: #38a169; color: #fff; }
.btn-confirmar:hover { background: #2f855a; }
.btn-wa { background: #25d366; color: #fff; }
.btn-wa:hover { background: #1da851; }
.btn-excluir { background: #e53e3e; color: #fff; }
.btn-excluir:hover { background: #c53030; }
.btn-copiar { background: #3182ce; color: #fff; }
.btn-copiar:hover { background: #2b6cb0; }
.vazio { text-align: center; padding: 60px 20px; color: #888; }
.vazio i { font-size: 48px; margin-bottom: 16px; color: #ccc; }
.toast { position: fixed; bottom: 24px; right: 24px; background: #2d2d2d; color: #fff; padding: 14px 20px; border-radius: 10px; font-size: 14px; transform: translateY(100px); opacity: 0; transition: .3s; z-index: 200; }
.toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1><i class="fa-solid fa-lock"></i> Painel de Controle — Espaço Cris</h1>
      <p>Gerencie os pedidos pendentes e confirme os pagamentos PIX</p>
    </div>
    <a href="index.html" target="_blank"><i class="fa-solid fa-store"></i> Ver Loja</a>
  </div>
  <div id="listaPedidos"></div>
</div>
<div class="toast" id="toast"></div>

<script>
function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function gerarMensagemWhatsApp(pedido) {
  let texto = 'Olá! Novo pedido na Espaço Cris Calçados:%0A%0A';
  texto += '*Cliente:* ' + encodeURIComponent(pedido.nome) + '%0A';
  texto += '*Telefone:* ' + encodeURIComponent(pedido.telefone) + '%0A';
  if (pedido.endereco) texto += '*Endereço:* ' + encodeURIComponent(pedido.endereco) + '%0A';
  texto += '%0A*Itens:*%0A';
  pedido.itens.forEach(item => {
    texto += '• ' + encodeURIComponent(item.nome) + ' - Qtd: ' + item.qtd + ' - R$ ' + (item.preco * item.qtd).toFixed(2).replace('.', ',') + '%0A';
  });
  texto += '%0A*Total: R$ ' + pedido.total.toFixed(2).replace('.', ',') + '*%0A';
  texto += '%0A*Chave PIX usada:* ' + pedido.chavePix + '%0A';
  texto += '*ID do Pedido:* ' + pedido.id;
  return 'https://wa.me/5527997787772?text=' + texto;
}

function carregarPedidos() {
  const container = document.getElementById('listaPedidos');
  let pedidos = JSON.parse(localStorage.getItem('pedidos_pendentes') || '[]');
  // Ordenar: pendentes primeiro, depois por data
  pedidos.sort((a, b) => {
    if (a.status === b.status) return new Date(b.data) - new Date(a.data);
    return a.status === 'pendente' ? -1 : 1;
  });

  if (pedidos.length === 0) {
    container.innerHTML = '<div class="vazio"><i class="fa-solid fa-clipboard-list"></i><h3>Nenhum pedido encontrado</h3><p>Os pedidos aparecerão aqui quando os clientes finalizarem uma compra.</p></div>';
    return;
  }

  container.innerHTML = '';
  pedidos.forEach(p => {
    const confirmado = p.status === 'confirmado';
    const card = document.createElement('div');
    card.className = 'pedido-card' + (confirmado ? ' confirmado' : '');

    let itensHtml = '<div class="pedido-itens"><h4>Itens do pedido</h4>';
    p.itens.forEach(item => {
      itensHtml += '<div class="item-row"><span>' + item.nome + ' (x' + item.qtd + ')</span><span>R$ ' + (item.preco * item.qtd).toFixed(2).replace('.', ',') + '</span></div>';
    });
    itensHtml += '</div>';

    let acoesHtml = '';
    if (!confirmado) {
      acoesHtml += '<button class="btn btn-confirmar" onclick="confirmarPedido(\'' + p.id + '\')"><i class="fa-solid fa-check"></i> Confirmar PIX</button>';
    }
    acoesHtml += '<button class="btn btn-wa" onclick="window.open(gerarMensagemWhatsAppById(\'' + p.id + '\'), \'_blank\')"><i class="fa-brands fa-whatsapp"></i> Abrir WhatsApp</button>';
    acoesHtml += '<button class="btn btn-copiar" onclick="copiarMensagem(\'' + p.id + '\')"><i class="fa-solid fa-copy"></i> Copiar msg</button>';
    acoesHtml += '<button class="btn btn-excluir" onclick="excluirPedido(\'' + p.id + '\')"><i class="fa-solid fa-trash"></i> Excluir</button>';

    card.innerHTML =
      '<div class="pedido-header">' +
        '<span class="pedido-id">#' + p.id + '</span>' +
        '<span class="pedido-status ' + (confirmado ? 'status-confirmado' : 'status-pendente') + '">' + (confirmado ? 'Confirmado' : 'Aguardando PIX') + '</span>' +
      '</div>' +
      '<div class="pedido-dados">' +
        '<strong>Cliente:</strong> ' + escapeHtml(p.nome) + '<br>' +
        '<strong>Telefone:</strong> ' + escapeHtml(p.telefone) + '<br>' +
        (p.endereco ? '<strong>Endereço:</strong> ' + escapeHtml(p.endereco) + '<br>' : '') +
        '<strong>Data:</strong> ' + new Date(p.data).toLocaleString('pt-BR') +
      '</div>' +
      itensHtml +
      '<div class="pedido-total">Total: R$ ' + p.total.toFixed(2).replace('.', ',') + '</div>' +
      '<div class="acoes">' + acoesHtml + '</div>';
    container.appendChild(card);
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.innerText = text;
  return div.innerHTML;
}

function confirmarPedido(id) {
  let pedidos = JSON.parse(localStorage.getItem('pedidos_pendentes') || '[]');
  const p = pedidos.find(x => x.id === id);
  if (!p) return;
  p.status = 'confirmado';
  p.dataConfirmacao = new Date().toISOString();
  localStorage.setItem('pedidos_pendentes', JSON.stringify(pedidos));
  mostrarToast('Pedido #' + id + ' confirmado com sucesso!');
  carregarPedidos();
}

function excluirPedido(id) {
  if (!confirm('Tem certeza que deseja excluir o pedido #' + id + '?')) return;
  let pedidos = JSON.parse(localStorage.getItem('pedidos_pendentes') || '[]');
  pedidos = pedidos.filter(x => x.id !== id);
  localStorage.setItem('pedidos_pendentes', JSON.stringify(pedidos));
  mostrarToast('Pedido excluído.');
  carregarPedidos();
}

function gerarMensagemWhatsAppById(id) {
  let pedidos = JSON.parse(localStorage.getItem('pedidos_pendentes') || '[]');
  const p = pedidos.find(x => x.id === id);
  if (!p) return '#';
  return gerarMensagemWhatsApp(p);
}

function copiarMensagem(id) {
  const url = gerarMensagemWhatsAppById(id);
  navigator.clipboard.writeText(decodeURIComponent(url.replace('https://wa.me/5527997787772?text=', ''))).then(() => {
    mostrarToast('Mensagem copiada! Cole no WhatsApp.');
  }).catch(() => {
    mostrarToast('Erro ao copiar. Use o botão WhatsApp.');
  });
}

// Atualizar a cada 3 segundos para ver novos pedidos
setInterval(carregarPedidos, 3000);
carregarPedidos();
</script>
</body>
</html>
