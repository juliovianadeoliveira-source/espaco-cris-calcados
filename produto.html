atálogo</a></div></header><main class="wrap"><div id="loading">Carregando produto...</div><div id="content" class="product" style="display:none"><div class="gallery"><div class="image-stage" id="imageStage"><img id="main" class="main" alt="Produto"><button id="imgPrev" class="gallery-arrow prev" type="button" aria-label="Foto anterior">‹</button><button id="imgNext" class="gallery-arrow next" type="button" aria-label="Próxima foto">›</button></div><div id="thumbs" class="thumbs"></div></div><div class="info"><div class="eyebrow">Detalhes do produto</div><h1 id="name"></h1><div id="price" class="price"></div><p id="desc" class="desc"></p><div class="section"><h3>Escolha a numeração</h3><div id="sizes" class="sizes"></div><p id="stock" class="stock"></p></div><div class="section"><h3>Quantidade</h3><div class="qty"><button id="minus" type="button">−</button><b id="qty">1</b><button id="plus" type="button">+</button></div></div><div class="section"><h3>Calcule o frete</h3><div class="cepbox"><div class="cepRow"><input id="cep" inputmode="numeric" maxlength="9" placeholder="Digite seu CEP"><button id="calc" type="button">Calcular frete</button></div><div id="frete" class="frete">Informe o CEP para consultar a entrega.</div></div></div><button id="order" class="order" type="button">🛍️ Comprar e pagar com PIX</button><a class="whats" href="https://wa.me/5527997787772" target="_blank">💬 Falar com a loja pelo WhatsApp</a></div></div></main><script>const SB='https://nnhljxmmrqekoxcapdkm.supabase.co',KEY='sb_publishable_mPNEE_t2HTfU5f2rUDwrig_u9ls7HrE';let p=null,imgs=[],sizes=[],sel='',qty=1,frete=null;const $=s=>document.querySelector(s),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});async function api(path){const r=await fetch(SB+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error('Supabase HTTP '+r.status);return r.json()}function freight(cep){const unit=Number(p?.preco_promocional||p?.preco||0),sub=unit*qty;if(sub>=200)return 0;const d=Number(cep.replace(/\D/g,'').slice(0,2));if(d>=20&&d<=28)return 14.9;if(d===29)return 17.9;if(d>=1&&d<=19)return 18.9;if(d>=30&&d<=39)return 19.9;if(d>=80&&d<=99)return 24.9;if(d>=70&&d<=79)return 26.9;return 29.9}function calc(){const cep=$('#cep').value.replace(/\D/g,'');if(cep.length!==8){$('#frete').textContent='Digite um CEP válido com 8 números.';frete=null;return}frete=freight(cep);$('#frete').innerHTML=frete===0?'✓ <b>Frete grátis</b> para este pedido.':'✓ Entrega estimada: <b>'+money(frete)+'</b>';sessionStorage.setItem('checkout_cep',cep)}(async()=>{try{const id=new URLSearchParams(location.search).get('id');if(!id)throw Error('Produto não informado');const rows=await api('produtos?select=id,nome,descricao,preco,preco_promocional,ativo&id=eq.'+encodeURIComponent(id)+'&ativo=eq.true');if(!rows.length)throw Error('Produto não encontrado');p=rows[0];imgs=await api('produto_imagens?select=url,ordem&produto_id=eq.'+encodeURIComponent(id)+'&order=ordem.asc');try{sizes=await api('produto_tamanhos?select=tamanho,estoque,ativo&produto_id=eq.'+encodeURIComponent(id)+'&ativo=eq.true&order=tamanho.asc')}catch(_){sizes=[]}if(!sizes.length)sizes=['34','35','36','37','38','39'].map(tamanho=>({tamanho,consulta:true}));$('#name').textContent=p.nome;$('#desc').textContent=p.descricao||'Escolha sua numeração, quantidade e calcule o frete antes de finalizar.';const promo=Number(p.preco_promocional||0),preco=Number(p.preco||0);$('#price').textContent=money(promo>0&&promo<preco?promo:preco);let imgIndex=0;function showImage(i){if(!imgs.length)return;imgIndex=(i+imgs.length)%imgs.length;$('#main').src=imgs[imgIndex].url;document.querySelectorAll('#thumbs img').forEach((x,n)=>x.classList.toggle('active',n===imgIndex));document.querySelectorAll('#thumbs img')[imgIndex]?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}$('#main').src=imgs[0]?.url||'';$('#thumbs').innerHTML=imgs.map((x,i)=>'<img class="'+(i===0?'active':'')+'" src="'+x.url+'" alt="Foto '+(i+1)+' de '+imgs.length+'">').join('');document.querySelectorAll('#thumbs img').forEach((im,i)=>im.onclick=()=>showImage(i));$('#imgPrev').hidden=imgs.length<2;$('#imgNext').hidden=imgs.length<2;$('#imgPrev').onclick=()=>showImage(imgIndex-1);$('#imgNext').onclick=()=>showImage(imgIndex+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')showImage(imgIndex-1);if(e.key==='ArrowRight')showImage(imgIndex+1)});let touchX=0;$('#imageStage').addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});$('#imageStage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>45)showImage(imgIndex+(dx<0?1:-1))},{passive:true});$('#sizes').innerHTML=sizes.map(s=>'<button class="size" type="button">'+s.tamanho+'</button>').join('');document.querySelectorAll('.size').forEach(b=>b.onclick=()=>{sel=b.textContent.trim();document.querySelectorAll('.size').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#stock').textContent='✓ Numeração '+sel+' selecionada'});$('#plus').onclick=()=>{qty=Math.min(20,qty+1);$('#qty').textContent=qty;if(frete!==null)calc()};$('#minus').onclick=()=>{qty=Math.max(1,qty-1);$('#qty').textContent=qty;if(frete!==null)calc()};$('#calc').onclick=calc;$('#cep').addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'').slice(0,8);e.target.value=v.length>5?v.slice(0,5)+'-'+v.slice(5):v;if(v.length===8)calc()});const oldCep=sessionStorage.getItem('checkout_cep');if(oldCep){$('#cep').value=oldCep.slice(0,5)+'-'+oldCep.slice(5);calc()}$('#order').onclick=()=>{if(!sel)return alert('Escolha a numeração antes de continuar.');if(!$('#cep').value.replace(/\D/g,'').match(/^\d{8}$/))return alert('Informe seu CEP para calcular o frete.');const d={id:String(p.id),nome:p.nome,preco:Number(p.preco||0),preco_promocional:Number(p.preco_promocional||0),tamanho:sel,quantidade:qty,imagem:imgs[0]?.url||'',cep:$('#cep').value.replace(/\D/g,'')};sessionStorage.
