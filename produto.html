<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto | Espaço Cris Calçados</title><style>body{font-family:Arial;margin:0;color:#251e23}.top{background:#c2185b;color:#fff;padding:12px;text-align:center}header{padding:18px;border-bottom:1px solid #eee}.bar{max-width:1100px;margin:auto;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:30px auto;padding:0 15px}.product{display:grid;grid-template-columns:1fr 1fr;gap:30px}.main{width:100%;aspect-ratio:1;object-fit:cover;background:#f7f2f5}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumbs img{width:70px;height:70px;object-fit:cover;border:2px solid transparent;cursor:pointer}.thumbs img.active{border-color:#c2185b}.price{font-size:28px;font-weight:bold;margin:15px 0}.sizes{display:flex;gap:8px;flex-wrap:wrap}.size{padding:11px 15px;border:1px solid #ddd;border-radius:9px;background:#fff;cursor:pointer}.size.active{background:#c2185b;color:#fff}.qty{display:flex;gap:12px;align-items:center;margin:20px 0}.qty button{width:42px;height:42px;font-size:20px}.order{width:100%;padding:15px;background:#24131d;color:#fff;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.whats{display:block;text-align:center;background:#25d366;color:#fff;padding:15px;margin-top:10px;border-radius:10px;text-decoration:none}@media(max-width:750px){.product{grid-template-columns:1fr}}</style></head><body><div class="top">✨ Espaço Cris Calçados • Escolha seu modelo, numeração e quantidade</div><header><div class="bar"><b>Espaço <span style="color:#c2185b">Cris</span> Calçados</b><a href="index.html#produtos">← Voltar ao catálogo</a></div></header><main class="wrap"><div id="loading">Carregando produto...</div><div id="content" class="product" style="display:none"><div><img id="main" class="main" alt="Produto"><div id="thumbs" class="thumbs"></div></div><div><div id="cat"></div><h1 id="name"></h1><div id="price" class="price"></div><p id="desc"></p><h3>Escolha a numeração</h3><div id="sizes" class="sizes"></div><p id="stock"></p><h3>Quantidade</h3><div class="qty"><button id="minus">−</button><b id="qty">1</b><button id="plus">+</button></div><button id="order" class="order">🛍️ Comprar e pagar com PIX</button><a class="whats" href="https://wa.me/5527997787772" target="_blank">💬 Conversar com a loja</a></div></div></main><script>const SB='https://nnhljxmmrqekoxcapdkm.supabase.co',KEY='sb_publishable_mPNEE_t2HTfU5f2rUDwrig_u9ls7HrE';let p=null,imgs=[],sizes=[],sel='',qty=1;const $=s=>document.querySelector(s);const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});async function api(path){const r=await fetch(SB+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error('Supabase HTTP '+r.status);return r.json()}(async()=>{try{const id=new URLSearchParams(location.search).get('id');if(!id)throw Error('Produto não informado');const rows=await api('produtos?select=id,nome,descricao,preco,preco_promocional,ativo&id=eq.'+encodeURIComponent(id)+'&ativo=eq.true');if(!rows.length)throw Error('Produto não encontrado');p=rows[0];imgs=await api('produto_imagens?select=url,ordem&produto_id=eq.'+encodeURIComponent(id)+'&order=ordem.asc');try{sizes=await api('produto_tamanhos?select=tamanho,estoque,ativo&produto_id=eq.'+encodeURIComponent(id)+'&ativo=eq.true&order=tamanho.asc')}catch(_){sizes=[]}if(!sizes.length)sizes=['34','35','36','37','38','39'].map(tamanho=>({tamanho,consulta:true}));$('#name').textContent=p.nome;$('#desc').textContent=p.descricao||'Consulte disponibilidade com a loja.';let promo=Number(p.preco_promocional||0),preco=Number(p.preco||0);$('#price').textContent=money(promo>0&&promo<preco?promo:preco);$('#main').src=imgs[0]?.url||'';$('#thumbs').innerHTML=imgs.map((x,i)=>'<img class="'+(i===0?'active':'')+'" src="'+x.url+'">').join('');document.querySelectorAll('#thumbs img').forEach((im,i)=>im.onclick=()=>{$('#main').src=imgs[i].url;document.querySelectorAll('#thumbs img').forEach(x=>x.classList.remove('active'));im.classList.add('active')});$('#sizes').innerHTML=sizes.map(s=>'<button class="size">'+s.tamanho+'</button>').join('');document.querySelectorAll('.size').forEach(b=>b.onclick=()=>{sel=b.textContent.trim();document.querySelectorAll('.size').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#stock').textContent=b.textContent.trim()+' selecionado'});$('#plus').onclick=()=>{qty=Math.min(20,qty+1);$('#qty').textContent=qty};$('#minus').onclick=()=>{qty=Math.max(1,qty-1);$('#qty').textContent=qty};$('#order').onclick=()=>{if(!sel)return alert('Escolha a numeração antes de continuar.');const d={id:String(p.id),nome:p.nome,preco:Number(p.preco||0),preco_promocional:Number(p.preco_promocional||0),tamanho:sel,quantidade:qty,imagem:imgs[0]?.url||''};sessionStorage.setItem('checkout_produto',JSON.stringify(d));location.href='checkout.html?id='+encodeURIComponent(p.id)+'&tamanho='+encodeURIComponent(sel)+'&quantidade='+qty};$('#loading').style.display='none';$('#content').style.display='grid'}catch(e){$('#loading').innerHTML='<b>Não foi possível carregar este produto.</b><p>'+e.message+'</p><a href="index.html#produtos">Voltar ao catálogo</a>';console.error(e)}})();</script></body></html>
